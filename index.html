<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg" href="/folhadecoqueiros-logo.jpg" />
    <title>Folha de Coqueiros — Dashboard Analítico e IA</title>
    <meta
      name="description"
      content="Inteligência de dados territoriais do bairro de Coqueiros: rede de atores (SNA), diagramas de enlace causal e assistente editorial com IA."
    />
    <!-- O acervo começa a baixar junto com o JS, e não só depois que ele executa
         (é o que segura o LCP). Mesma URL e modo do fetch em src/lib/data.ts. -->
    <link rel="preload" href="/data/noticias.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/data/atores.json" as="fetch" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Aplica as preferências antes da primeira pintura (evita o flash de tema).
         Arquivo externo e síncrono: a Content-Security-Policy proíbe scripts inline. -->
    <script src="/preferencias.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
