[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # O Vite 8 exige "^20.19.0 || >=22.12.0". Um "20" genérico depende de qual
  # 20.x a imagem do Netlify resolve e pode cair abaixo de 20.19, quebrando o
  # build; o 22 satisfaz a faixa com folga.
  NODE_VERSION = "22"

# Fallback de SPA: só age quando nenhum arquivo estático corresponde ao caminho.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Assets do Vite têm hash no nome: um arquivo novo a cada mudança, então podem
# ficar em cache para sempre. (O Netlify já entrega brotli/gzip automaticamente.)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Cabeçalhos de segurança. As chaves de IA do usuário vivem no navegador, então
# a CSP é a principal barreira contra exfiltração: scripts só da própria origem
# (nada inline) e conexões só com a origem e os provedores de IA suportados —
# a mesma lista de src/lib/ia/provedores.ts. Ao adicionar um provedor lá,
# acrescente o domínio em `connect-src` aqui.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://openrouter.ai https://api.openai.com https://api.anthropic.com https://generativelanguage.googleapis.com https://api.deepseek.com https://api.groq.com https://api.mistral.ai https://api.x.ai https://api.together.xyz https://api.fireworks.ai https://api.cerebras.ai https://api.perplexity.ai https://api.cohere.ai https://api.moonshot.ai; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
